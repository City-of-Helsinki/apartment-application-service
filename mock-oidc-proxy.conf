# Reverse proxy that is reachable as "mock-oidc" in the e2e network and
# forwards everything to the real mock-oauth2-server (mock-oidc-server).
#
# It exists only to adapt the sales UI's API token request to the mock.
# hds-react sends that request as
#   POST /e2e/token
#   Authorization: Bearer <user access token>
#   audience=...&grant_type=...&permission=%23access
# mock-oauth2-server 5.0.2 supports no grant that accepts this without
# client authentication (uma-ticket is unsupported, client_credentials and
# token-exchange require client credentials, the others need parameters
# hds-react never sends). A Bearer header on the token endpoint is therefore
# replaced with HTTP Basic client credentials, which turns the request into
# a regular client_credentials grant. The credentials are dummies: the mock
# accepts any client id and secret.

map $http_authorization $mock_oidc_token_authorization {
    "~^Bearer\s" "Basic ZTJlLXNhbGVzLXVpOmUyZQ==";  # e2e-sales-ui:e2e
    default $http_authorization;
}

server {
    listen 8080;

    # Resolve the upstream per request through Docker's embedded DNS so a
    # recreated mock-oidc-server (new IP) does not leave nginx pointing at
    # a stale address.
    resolver 127.0.0.11 valid=10s;
    set $mock_oidc_upstream http://mock-oidc-server:8080;

    # The mock derives each token's `iss` and every URL it renders from the
    # Host header, so the client's Host (mock-oidc:8080 in the network,
    # localhost:18083 from the host machine) is passed through unchanged.
    proxy_set_header Host $http_host;
    proxy_redirect off;
    proxy_http_version 1.1;

    location ~ ^/[^/]+/token$ {
        # proxy_set_header at this level replaces, not extends, the
        # server-level list, so Host is repeated here.
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $mock_oidc_token_authorization;
        proxy_pass $mock_oidc_upstream;
    }

    location / {
        proxy_pass $mock_oidc_upstream;
    }
}
